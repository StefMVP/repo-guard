name: Repository checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./bin/repo-guard install
      - run: python3 -m unittest discover -p 'test_*.py'
      - run: python3 -m compileall -q repo_guard.py report_html.py
